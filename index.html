<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- <body class="dark-mode"> -->
<body>
    <div class="container">
        <div class="screen" >
            <span id="prev"></span>
            <span id="operation"></span>
            <div id="output">0</div>
            <div id="sign"></div>
        </div>
        <div class="button-wrapper">
            <button class="button operation" id="delete">⌫</button>
            <button class="button operation" id="clear">C</button>
            <button class="button operation" id="sqrt">√</button>
            <button class="button operation" id="÷">÷</button>
        </div>
        <div class="button-wrapper">
            <button class="button" id="7">7</button>
            <button class="button" id="8">8</button>
            <button class="button" id="9">9</button>
            <button class="button operation" id="x">x</button>
        </div>
        <div class="button-wrapper">
            <button class="button" id="4">4</button>
            <button class="button" id="5">5</button>
            <button class="button" id="6">6</button>
            <button class="button operation" id="-">-</button>
        </div>
        <div class="button-wrapper">
            <button class="button" id="1">1</button>
            <button class="button" id="2">2</button>
            <button class="button" id="3">3</button>
            <button class="button operation" id="+">+</button>
        </div>
        <div class="button-wrapper">
            <button class="button operation" id="swapSign">+/-</button>
            <button class="button" id="0">0</button>
            <button class="button operation" id="decimal">.</button>
            <button class="button operation" id="equals">=</button>
        </div>
    </div>

    <div class="mode"> 
        <div class="knob">☀️</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
